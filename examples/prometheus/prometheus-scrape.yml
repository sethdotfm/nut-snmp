# Add to scrape_configs in your Prometheus config.
#
# Note metrics_path: nut_exporter serves UPS metrics on /ups_metrics and keeps
# /metrics for its own process telemetry. Scraping the default path yields Go
# runtime stats and no UPS data at all.

scrape_configs:
  - job_name: nut
    metrics_path: /ups_metrics
    static_configs:
      - targets: ['nut-exporter:9199']
